name: Deploy

on:
  push:
    branches: [main]

# The migrate job always runs before deploy.
# If migrations fail, the deploy job is skipped entirely — this ensures
# the database schema is always up to date before new application code
# goes live, eliminating the window where code references columns that
# don't exist yet (or no longer exist).
jobs:
  migrate:
    name: Run database migrations
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install server dependencies
        run: pnpm --filter server install --frozen-lockfile

      # Authenticate with GCP so the Cloud SQL Auth Proxy can reach the database
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      # The Cloud SQL Auth Proxy opens a secure tunnel to Cloud SQL.
      # DATABASE_URL uses a Unix socket path that the proxy exposes locally.
      - name: Install Cloud SQL Auth Proxy
        run: |
          curl -fsSL -o cloud-sql-proxy \
            https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/v2.11.4/cloud-sql-proxy.linux.amd64
          chmod +x cloud-sql-proxy

      - name: Start Cloud SQL Auth Proxy
        run: |
          sudo mkdir -p /cloudsql && sudo chown $USER /cloudsql
          ./cloud-sql-proxy \
            --unix-socket /cloudsql \
            ${{ secrets.CLOUD_SQL_INSTANCE_CONNECTION_NAME }} &
          until [ -S "/cloudsql/${{ secrets.CLOUD_SQL_INSTANCE_CONNECTION_NAME }}/.s.PGSQL.5432" ]; do sleep 1; done

      - name: Run migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: pnpm --filter server migrate

  deploy:
    name: Deploy to Cloud Run
    runs-on: ubuntu-latest
    # Only runs if the migrate job completed successfully.
    # A failed migration blocks the deploy — no code ships with a broken schema.
    needs: migrate

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      # Source deployment — Cloud Build builds the image, Cloud Run deploys it.
      # No manual docker build or push required.
      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: troupe-api
          region: us-central1
          source: .
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          env_vars: |
            DATABASE_URL=${{ secrets.DATABASE_URL }}
            FIREBASE_PROJECT_ID=${{ secrets.FIREBASE_PROJECT_ID }}
            FIREBASE_CLIENT_EMAIL=${{ secrets.FIREBASE_CLIENT_EMAIL }}
            FIREBASE_PRIVATE_KEY=${{ secrets.FIREBASE_PRIVATE_KEY }}
          flags: --add-cloudsql-instances=${{ secrets.CLOUD_SQL_INSTANCE_CONNECTION_NAME }}

  deploy-hosting:
    name: Deploy to Firebase Hosting
    runs-on: ubuntu-latest
    needs: deploy

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install client dependencies
        run: pnpm --filter client install --frozen-lockfile

      - name: Build client
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
        run: pnpm --filter client build

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
          projectId: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
